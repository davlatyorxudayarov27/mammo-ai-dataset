name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python lint + syntax + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (without ultralytics for speed)
        run: |
          python -m pip install --upgrade pip
          grep -v "ultralytics" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install ruff

      - name: ruff lint (errors only)
        run: ruff check --select E,F,W app/ --ignore E501

      - name: Python syntax check
        run: python -m compileall -q app/

      - name: DB schema bootstrap
        run: |
          cd app && python -c "from db import init_db; init_db(); print('schema ok')"

      - name: Server smoke test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in {1..20}; do
            curl -sf http://127.0.0.1:8000/api/config && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/api/config | python -c "import json,sys; d=json.load(sys.stdin); assert 'auth_required' in d; print('OK', d)"
          curl -sf http://127.0.0.1:8000/api/labels | python -c "import json,sys; d=json.load(sys.stdin); assert 'labels' in d"
          curl -s -o /dev/null -w 'PUT no token: %{http_code}\n' -X PUT http://127.0.0.1:8000/api/annotations -H "content-type: application/json" -d '{"source":"upload","ref":"x","annotations":[]}'
          kill $SERVER_PID || true

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax
        run: node --check app/static/app.js
      - name: HTML basic validate (presence of key IDs)
        run: |
          for id in dicomImg annoSvg loginModal adminModal statsModal patientModal deidModal historyModal; do
            grep -q "id=\"$id\"" app/static/index.html || (echo "missing #$id" && exit 1)
          done
          echo "all required DOM ids present"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mamograf:ci .
      - name: Run container smoke
        run: |
          docker run -d --name mamograf-test -p 8000:8000 mamograf:ci
          for i in {1..30}; do
            curl -sf http://127.0.0.1:8000/api/config && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/config
          docker logs mamograf-test
          docker stop mamograf-test
